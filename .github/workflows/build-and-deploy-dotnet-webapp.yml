name: Shared - Build and deploy container to Azure Container Apps

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        type: string
        required: true
      build_context:
        description: Docker build context path, relative to the repository root.
        type: string
        required: true
      dotnet_test_path:
        description: Solution or project path used for restore/build/test, relative to repository root.
        type: string
        required: false
        default: .
      checkout_ref:
        description: Git ref (branch, tag, or SHA) to checkout for build/test/publish/deploy.
        type: string
        required: false
        default: ""
      dotnet_sdk_version:
        description: .NET SDK version to use.
        type: string
        required: false
        default: 10.0.x
      image_name:
        description: Image repository name (without registry or tag), e.g. "event-api". Published as ghcr.io/<repository_owner>/<image_name>.
        type: string
        required: true
      container_app_name:
        description: Name of the target Azure Container App.
        type: string
        required: true
      resource_group:
        description: Resource group that contains the target Container App.
        type: string
        required: true
      environment_name:
        description: GitHub Environment name used for OIDC and deployment protection rules.
        type: string
        required: false
        default: production
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      GHCR_PAT:
        description: GitHub PAT (classic, read:packages) used as the long-lived credential Azure Container Apps uses to pull images from GHCR at runtime.
        required: true

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_sdk_version }}
          cache: true
          cache-dependency-path: |
            ${{ inputs.build_context }}/**/*.csproj
            ${{ inputs.build_context }}/**/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore "${{ inputs.dotnet_test_path }}"

      - name: Build
        run: dotnet build "${{ inputs.dotnet_test_path }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ inputs.dotnet_test_path }}" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory "${{ github.workspace }}/.test-results/${{ inputs.image_name }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.image_name }}
          path: ${{ github.workspace }}/.test-results/${{ inputs.image_name }}
          if-no-files-found: warn

  build_and_push:
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ inputs.image_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.registry }}/${{ inputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    permissions:
      id-token: write
      contents: none
    runs-on: ubuntu-latest
    needs: build_and_push
    concurrency:
      group: deploy-${{ inputs.container_app_name }}-${{ inputs.environment_name }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment_name }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point Container App registry credentials at GHCR
        run: |
          az containerapp registry set \
            --name "${{ inputs.container_app_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --server ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GHCR_PAT }}"

      - name: Deploy Container App revision
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ needs.build_and_push.outputs.image }}
          containerAppName: ${{ inputs.container_app_name }}
          resourceGroup: ${{ inputs.resource_group }}