name: Deploy to Production

on:
  push:
    branches: [ "master" ]

permissions:
  id-token: write
  contents: read

jobs:
  agenda:
    uses: ./.github/workflows/build-and-deploy-dotnet-webapp.yml
    with:
      dockerfile: Agenda/Agenda.Api/Dockerfile
      build_context: Agenda
      dotnet_test_path: Agenda/Agenda.sln
      image_name: agenda-api
      container_app_name: agenda
      resource_group: event-agenda-project
      environment_name: production
      deploy_enabled: true
      publish_latest: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID_PROD }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  bff:
    uses: ./.github/workflows/build-and-deploy-dotnet-webapp.yml
    with:
      dockerfile: Bff/Bff.Api/Dockerfile
      build_context: Bff
      dotnet_test_path: Bff/Bff.sln
      image_name: bff-api
      container_app_name: bff
      resource_group: event-agenda-project
      environment_name: production
      deploy_enabled: true
      publish_latest: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID_PROD }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  events:
    uses: ./.github/workflows/build-and-deploy-dotnet-webapp.yml
    with:
      dockerfile: Event/Event.Api/Dockerfile
      build_context: Event
      dotnet_test_path: Event/Event.sln
      image_name: event-api
      container_app_name: events
      resource_group: event-agenda-project
      environment_name: production
      deploy_enabled: true
      publish_latest: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID_PROD }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
