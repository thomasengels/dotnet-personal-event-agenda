name: Build BFF for feature branches and optional dev deploy

on:
  push:
    branches-ignore: [ "master" ]
    paths:
      - "Bff/**"
      - ".github/workflows/build-bff-master.yml"
      - ".github/workflows/build-bff-feature.yml"
      - ".github/workflows/build-and-deploy-dotnet-webapp.yml"
  workflow_dispatch:
    inputs:
      deploy_to_development:
        description: Deploy to development after build/test/push.
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy-dotnet-webapp.yml
    with:
      dockerfile: Bff/Bff.Api/Dockerfile
      build_context: Bff
      dotnet_test_path: Bff/Bff.sln
      image_name: bff-api
      registry_login_server: eventagendaregistry.azurecr.io
      acr_name: eventagendaregistry
      container_app_name: bff
      resource_group: event-agenda-project-dev
      key_vault_name: event-agenda-kv
      environment_name: development
      deploy_enabled: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_development == 'yes' }}
      ci_only: ${{ github.event_name == 'push' }}
      publish_latest: false
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID_DEV }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}