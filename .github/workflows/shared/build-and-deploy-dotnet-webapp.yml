name: Shared - Build and deploy container to Azure Web App

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        type: string
        required: true
      build_context:
        description: Docker build context path, relative to the repository root.
        type: string
        required: true
      image_name:
        description: Image repository name (without registry or tag), e.g. "event-api".
        type: string
        required: true
      registry_login_server:
        description: Container registry login server, e.g. "myregistry.azurecr.io".
        type: string
        required: true
      azure_webapp_name:
        type: string
        required: true
      environment_name:
        type: string
        required: false
        default: Development
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      azure_webapp_publish_profile:
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_login_server }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Compute image reference
        id: meta
        run: echo "image=${{ inputs.registry_login_server }}/${{ inputs.image_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ inputs.registry_login_server }}/${{ inputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy container to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.azure_webapp_name }}
          publish-profile: ${{ secrets.azure_webapp_publish_profile }}
          images: ${{ needs.build-and-push.outputs.image }}