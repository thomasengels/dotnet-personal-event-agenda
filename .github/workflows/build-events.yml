name: Build and deploy EventServiceApi to Azure Container Apps

on:
  push:
    branches: [ "master" ]
    paths:
      - "Event/**"
      - ".github/workflows/build-events.yml"
      - ".github/workflows/build-and-deploy-dotnet-webapp.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy-dotnet-webapp.yml
    with:
      dockerfile: Event/Event.Api/Dockerfile
      build_context: Event
      dotnet_test_path: Event/Event.sln
      image_name: event-api
      registry_login_server: eventagendaregistry.azurecr.io
      acr_name: eventagendaregistry
      container_app_name: events
      resource_group: event-agenda-project
      key_vault_name: event-agenda-kv
      environment_name: development
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
