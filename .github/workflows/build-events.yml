name: Build and deploy EventServiceApi to Azure Container Apps

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy-dotnet-webapp.yml
    with:
      dockerfile: Event/Event.Api/Dockerfile
      build_context: Event
      image_name: event-api
      registry_login_server: eventagendaregistry.azurecr.io
      acr_name: eventagendaregistry
      container_app_name: events
      resource_group: event-agenda-project
      key_vault_name: event-agenda-kv
      environment_name: Development
    secrets:
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
